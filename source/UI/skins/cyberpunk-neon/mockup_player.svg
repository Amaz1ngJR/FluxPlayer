<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Runtime-aligned Player surface: optional HUD panels and 64px bottom dock. -->
  <defs>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080B12"/>
      <stop offset=".54" stop-color="#121827"/>
      <stop offset="1" stop-color="#090B13"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00E8FF" stop-opacity="0"/>
      <stop offset=".28" stop-color="#00E8FF"/>
      <stop offset=".72" stop-color="#A855FF"/>
      <stop offset="1" stop-color="#FF3DF2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="played" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00E8FF"/>
      <stop offset=".6" stop-color="#2DA7FF"/>
      <stop offset="1" stop-color="#A855FF"/>
    </linearGradient>
    <radialGradient id="frame" cx="0" cy="0" r="1" gradientTransform="translate(730 400) scale(520 310)">
      <stop stop-color="#2DA7FF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#030511" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="900" fill="#030511"/>
  <rect width="1440" height="836" fill="url(#video)"/>
  <rect width="1440" height="836" fill="url(#frame)"/>
  <text x="720" y="410" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#6F89A8" letter-spacing="3">PLAYING MEDIA</text>

  <!-- Media Info: surfaces.hud.mediaInfoW=450, web height=384 (增加GOP行), margin=10. -->
  <g font-family="Consolas, monospace" font-size="12">
    <rect x="10" y="10" width="450" height="384" rx="6" fill="#070D22" fill-opacity=".92" stroke="#00E8FF" stroke-opacity=".68"/>
    <rect x="10" y="10" width="450" height="27" rx="6" fill="#0A1230"/>
    <text x="22" y="29" fill="#EAF8FF">Media Info</text>
    <text x="438" y="29" fill="#6F89A8">x</text>
    <text x="24" y="59" fill="#A8C7E8">FILE: stream_title.mp4</text>
    <path d="M22 69H448" stroke="#5A8CBE" stroke-opacity=".22"/>
    <text x="24" y="91" fill="#EAF8FF">WEB VIDEO:</text>
    <text x="42" y="111" fill="#A8C7E8">Platform   : bilibili</text>
    <text x="42" y="130" fill="#A8C7E8">Uploader   : Flux Channel</text>
    <text x="42" y="149" fill="#A8C7E8">Views      : 1,234,567</text>
    <text x="42" y="168" fill="#A8C7E8">Upload Date: 2024-01-15</text>
    <path d="M22 182H448" stroke="#5A8CBE" stroke-opacity=".22"/>
    <text x="24" y="204" fill="#EAF8FF">VIDEO:</text>
    <text x="42" y="223" fill="#A8C7E8">Resolution : 1920x1080</text>
    <text x="42" y="242" fill="#A8C7E8">Codec      : H.264 (High)</text>
    <text x="42" y="261" fill="#A8C7E8">FPS        : 30.00</text>
    <text x="42" y="280" fill="#A8C7E8">GOP        : 60 frames (2.00 sec)</text>
    <path d="M22 294H448" stroke="#5A8CBE" stroke-opacity=".22"/>
    <text x="24" y="316" fill="#EAF8FF">AUDIO:</text>
    <text x="42" y="335" fill="#A8C7E8">Codec      : AAC (LC)</text>
    <text x="42" y="354" fill="#A8C7E8">Sample Rate: 48000 Hz</text>
    <text x="42" y="373" fill="#A8C7E8">Channels   : 2 (Stereo)</text>
    <text x="24" y="393" fill="#A8C7E8">Duration   : 01:32:18</text>
  </g>

  <!-- Statistics: surfaces.hud.statsW=240→400, statsH=180→330 (新增 VIDEO PIPELINE 区块). -->
  <g font-family="Consolas, monospace" font-size="12">
    <rect x="1030" y="10" width="400" height="330" rx="6" fill="#070D22" fill-opacity=".92" stroke="#A855FF" stroke-opacity=".62"/>
    <rect x="1030" y="10" width="400" height="27" rx="6" fill="#0A1230"/>
    <text x="1042" y="29" fill="#EAF8FF">Statistics</text>
    <text x="1418" y="29" fill="#6F89A8">x</text>
    <text x="1044" y="59" fill="#EAF8FF">PERFORMANCE:</text>
    <text x="1060" y="80" fill="#00E8FF">FPS        : 30</text>
    <text x="1060" y="99" fill="#A8C7E8">Bitrate    : 4.62 Mbps</text>
    <text x="1060" y="118" fill="#A8C7E8">Dropped    : 0</text>
    <path d="M1042 130H1418" stroke="#A855FF" stroke-opacity=".3"/>
    <text x="1044" y="152" fill="#EAF8FF">BUFFER:</text>
    <text x="1060" y="171" fill="#A8C7E8">Video : 16 frames</text>
    <text x="1060" y="190" fill="#A8C7E8">Audio : 24 frames</text>
    <path d="M1042 202H1418" stroke="#A855FF" stroke-opacity=".3"/>
    <text x="1044" y="224" fill="#EAF8FF">VIDEO PIPELINE:</text>
    <text x="1060" y="243" fill="#A8C7E8">Decoder   : HARDWARE</text>
    <text x="1060" y="262" fill="#A8C7E8">Backend   : VideoToolbox</text>
    <text x="1060" y="281" fill="#A8C7E8">Device    : Apple M3</text>
    <text x="1060" y="300" fill="#00E8FF">Zero-copy : ACTIVE</text>
    <text x="1060" y="319" fill="#A8C7E8">Path      : IOSurface -> CGL texture -> OpenGL</text>
    <text x="1044" y="339" fill="#00E8FF">STATE : PLAYING</text>
  </g>

  <!-- Subtitle surface above the visible dock. -->
  <rect x="413" y="786" width="614" height="28" rx="3" fill="#030511" fill-opacity=".55"/>
  <text x="720" y="805" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#EAF8FF">Current subtitle remains clear above player controls.</text>

  <!-- Bottom dock: y=836, height=64; first line seek, second line controls. -->
  <rect y="836" width="1440" height="64" fill="#070D22" fill-opacity=".92"/>
  <path d="M0 837H1440" stroke="url(#rail)" stroke-width="2"/>
  <rect x="8" y="843" width="1316" height="16" rx="2" fill="#0A1230" stroke="#5A8CBE" stroke-opacity=".22"/>
  <rect x="8" y="843" width="654" height="16" rx="2" fill="url(#played)"/>
  <circle cx="662" cy="851" r="12" fill="#00E8FF" fill-opacity=".08"/>
  <circle cx="662" cy="851" r="8" fill="#00E8FF" fill-opacity=".22"/>
  <circle cx="662" cy="851" r="5" fill="#00E8FF"/>
  <text x="1333" y="855" font-family="Consolas, monospace" font-size="12" fill="#EAF8FF">00:41:52 / 01:32:18</text>

  <!-- Active download group at the left of row two. -->
  <g font-family="Consolas, monospace" font-size="11">
    <rect x="8" y="870" width="72" height="22" rx="3" stroke="#A855FF" stroke-opacity=".62"/>
    <text x="44" y="885" text-anchor="middle" fill="#A855FF">Download</text>
    <rect x="88" y="870" width="120" height="22" rx="3" fill="#0A1230"/>
    <text x="148" y="885" text-anchor="middle" fill="#EAF8FF">0%</text>
    <rect x="212" y="870" width="24" height="22" rx="3" stroke="#00E8FF" stroke-opacity=".68"/>
    <path d="M220 876V886M228 876V886" stroke="#00E8FF" stroke-width="2"/>
    <rect x="240" y="870" width="24" height="22" rx="3" stroke="#FF3B7A" stroke-opacity=".55"/>
    <path d="M247 877L257 887M257 877L247 887" stroke="#FF3B7A"/>
    <text x="270" y="879" fill="#00E8FF" fill-opacity=".72">3MiB/s  10MiB</text>
    <text x="270" y="890" fill="#00E8FF" fill-opacity=".56">ETA 38:18</text>
  </g>

  <!-- Center playback controls. -->
  <g font-family="Consolas, monospace" font-size="11">
    <rect x="580" y="870" width="80" height="22" rx="3" stroke="#00E8FF" stroke-opacity=".68"/>
    <path d="M616 876V886M624 876V886" stroke="#00E8FF" stroke-width="3"/>
    <rect x="668" y="870" width="60" height="22" rx="3" stroke="#A855FF" stroke-opacity=".62"/>
    <rect x="695" y="878" width="7" height="7" fill="#A855FF"/>
    <rect x="736" y="870" width="70" height="22" rx="3" fill="#FF3B7A" fill-opacity=".18" stroke="#FF3B7A"/>
    <text x="771" y="885" text-anchor="middle" fill="#FF3B7A">* REC V</text>
    <rect x="814" y="870" width="60" height="22" rx="3" stroke="#00E8FF" stroke-opacity=".68"/>
    <text x="844" y="885" text-anchor="middle" fill="#00E8FF">REC A</text>
  </g>

  <!-- Right toolbar. -->
  <g font-family="Consolas, monospace" font-size="11">
    <rect x="1120" y="870" width="60" height="22" rx="3" stroke="#00E8FF" stroke-opacity=".68"/>
    <text x="1150" y="885" text-anchor="middle" fill="#00E8FF">1080P</text>
    <rect x="1184" y="870" width="60" height="22" rx="3" stroke="#00E8FF" stroke-opacity=".68"/>
    <text x="1214" y="885" text-anchor="middle" fill="#00E8FF">Speed</text>
    <rect x="1248" y="870" width="26" height="22" rx="3" stroke="#00E8FF" stroke-opacity=".68"/>
    <g stroke="#00E8FF" stroke-opacity=".86" fill="none">
      <circle cx="1261" cy="881" r="4"/>
      <path d="M1261 874V876M1261 886V888M1254 881H1256M1266 881H1268M1256 876L1257.5 877.5M1264.5 884.5L1266 886M1266 876L1264.5 877.5M1257.5 884.5L1256 886"/>
    </g>
    <rect x="1278" y="870" width="26" height="22" rx="3" stroke="#00E8FF" stroke-opacity=".68"/>
    <path d="M1285 879H1289L1293 876V886L1289 883H1285Z" fill="#00E8FF" fill-opacity=".86"/>
    <path d="M1295 878Q1299 881 1295 884" stroke="#A8C7E8" stroke-opacity=".7"/>
    <rect x="1308" y="870" width="120" height="22" rx="3" fill="#0A1230" stroke="#5A8CBE" stroke-opacity=".22"/>
    <path d="M1318 881H1418" stroke="#136C8F"/>
    <path d="M1318 881H1380" stroke="#00E8FF"/>
    <circle cx="1380" cy="881" r="3" fill="#00E8FF"/>
  </g>
</svg>
