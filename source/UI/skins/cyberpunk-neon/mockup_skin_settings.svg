<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Runtime-aligned Settings modal: full functional settings with Appearance section. -->
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00E8FF" stop-opacity="0"/>
      <stop offset=".25" stop-color="#00E8FF"/>
      <stop offset=".72" stop-color="#A855FF"/>
      <stop offset="1" stop-color="#FF3DF2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#101522"/>
  <path d="M0 837H1440" stroke="url(#rail)" stroke-width="2" opacity=".35"/>
  <rect width="1440" height="900" fill="#030511" fill-opacity=".59"/>
  <!-- surfaces.settings: max 920x640, centered; LOGGING page selected. -->
  <rect x="260" y="130" width="920" height="640" rx="6" fill="#070D22" fill-opacity=".97" stroke="#00E8FF"/>
  <text x="284" y="163" font-family="Consolas, monospace" font-size="15" letter-spacing="2" fill="#00E8FF">SETTINGS</text>
  <path d="M284 174H1156" stroke="url(#rail)" stroke-width="2"/>
  <rect x="1128" y="146" width="28" height="22" rx="3" stroke="#00E8FF" stroke-opacity=".68"/>
  <text x="1142" y="161" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#00E8FF">X</text>
  <text x="284" y="194" font-family="Consolas, monospace" font-size="11" fill="#6F89A8">Live tweaks. Persisted to fluxplayer.ini on change.</text>
  <path d="M284 207H1156" stroke="#5A8CBE" stroke-opacity=".22"/>

  <g font-family="Consolas, monospace" font-size="11">
    <!-- Persistent navigation. -->
    <rect x="284" y="230" width="136" height="34" rx="3" stroke="#5A8CBE" stroke-opacity=".22"/>
    <text x="352" y="251" text-anchor="middle" fill="#A8C7E8">GENERAL</text>
    <rect x="284" y="270" width="136" height="34" rx="3" stroke="#5A8CBE" stroke-opacity=".22"/>
    <text x="352" y="291" text-anchor="middle" fill="#A8C7E8">CAPTURE</text>
    <rect x="284" y="310" width="136" height="34" rx="3" fill="#00E8FF" fill-opacity=".16" stroke="#00E8FF"/>
    <text x="352" y="331" text-anchor="middle" fill="#00E8FF">LOGGING</text>
    <rect x="284" y="350" width="136" height="34" rx="3" stroke="#5A8CBE" stroke-opacity=".22"/>
    <text x="352" y="371" text-anchor="middle" fill="#A8C7E8">APPEARANCE</text>
    <text x="284" y="424" fill="#6F89A8">GENERAL</text>
    <text x="284" y="443" fill="#6F89A8">Playback, subtitles,</text>
    <text x="284" y="460" fill="#6F89A8">network proxy</text>
    <text x="284" y="493" fill="#6F89A8">CAPTURE</text>
    <text x="284" y="512" fill="#6F89A8">Recording, screenshot,</text>
    <text x="284" y="529" fill="#6F89A8">information panels</text>

    <!-- Active LOGGING content. -->
    <text x="452" y="241" font-size="15" fill="#00E8FF">LOGGING</text>
    <text x="452" y="263" fill="#6F89A8">Diagnostics controls remain available while media keeps playing.</text>
    <path d="M452 282H1156" stroke="#5A8CBE" stroke-opacity=".22"/>
    <text x="452" y="316" fill="#A8C7E8">Log Level</text>
    <rect x="566" y="296" width="278" height="28" rx="3" fill="#050816" stroke="#00E8FF" stroke-opacity=".5"/>
    <text x="578" y="315" fill="#EAF8FF">INFO</text>
    <path d="M826 306L834 314L842 306" stroke="#00E8FF"/>
    <rect x="452" y="352" width="12" height="12" rx="2" stroke="#00E8FF"/><path d="M455 358L458 361L463 354" stroke="#00E8FF"/>
    <text x="474" y="362" fill="#EAF8FF">Write log to file</text>
    <text x="452" y="405" fill="#A8C7E8">Log File Path</text>
    <rect x="566" y="385" width="500" height="28" rx="3" fill="#050816" stroke="#00E8FF" stroke-opacity=".5"/>
    <text x="578" y="404" fill="#6F89A8">~/Library/Application Support/FluxPlayer/fluxplayer.log</text>
    <text x="452" y="440" fill="#6F89A8">Empty = app data directory. Runtime logger updates immediately.</text>
    <text x="452" y="491" fill="#A8C7E8">TCP Log Port</text>
    <rect x="566" y="471" width="190" height="28" rx="3" fill="#050816" stroke="#00E8FF" stroke-opacity=".5"/>
    <text x="578" y="490" fill="#EAF8FF">0</text>
    <text x="452" y="535" fill="#6F89A8">Port 0 disables streaming; valid range remains 0 - 65535.</text>

    <!-- Fixed status bar. -->
    <rect x="284" y="723" width="872" height="32" rx="4" fill="#00E8FF" fill-opacity=".10" stroke="#00E8FF" stroke-opacity=".55"/>
    <circle cx="296" cy="739" r="4" fill="#00E8FF"/>
    <text x="308" y="743" fill="#00E8FF">WATCHING / cyberpunk-neon / GEN 4</text>
  </g>
</svg>
