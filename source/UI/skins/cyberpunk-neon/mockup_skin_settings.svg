<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    cyberpunk-neon :: surfaces.settings 设计稿
    与 cyberpunk-neon.lua 的 skin.surfaces.settings.render() 逐项对齐。
    参考坐标 1440x900；面板 920x640 居中（widthRatio/heightRatio 未触发上限。

    几何来源（皮肤 cfg，见 lua 第 182-225 行）：
      panel      = min(920, W*0.92) x min(640, H*0.88) 居中 → x=260 y=130 920x640
      paddingX   = 24      navWidth = 136   navGap = 16   scrollBarW = 14
      bodyTop    = py+100  footerReserve = 80   statusBarH = 32
      navButtonH = 34      navButtonGap = 6      navHintGap = 40   navHintBlockH = 68
      headH      = 60（页头：页名 15px / 说明 11px / 细线）
      labelW     = contentW*0.28 = 197.7  → 控件列 x = 633.7
      行高       = bool 34 / 其它 54（有 hint 再加 20）；section 占位 30
      控件       = combo/numberInput/input 高 28；slider 高 20；按钮 32

    本页选定 LOGGING（4 项），它是路径类 + 下拉 + 数字输入 + 布尔四类控件
    各出现一次的那一页，能同时展示 Browse 按钮与失焦提交的数字框。
  -->
  <defs>
    <!-- gradients.primaryRail: 标题下与 section 下的渐变细线 -->
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00E8FF" stop-opacity="0"/>
      <stop offset=".25" stop-color="#00E8FF"/>
      <stop offset=".72" stop-color="#A855FF"/>
      <stop offset="1" stop-color="#FF3DF2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底层画面（真实运行时这里是播放器帧） -->
  <rect width="1440" height="900" fill="#101522"/>
  <path d="M0 837H1440" stroke="url(#rail)" stroke-width="2" opacity=".35"/>
  <!-- 遮罩：c.rect(0,0,W,H,"bgVoid",overlayAlpha) → #030511 @ 0.59 -->
  <rect width="1440" height="900" fill="#030511" fill-opacity=".59"/>

  <!-- 面板本体：bgPanel @0.97，圆角 6；外框 accentPrimary @0.9 -->
  <rect x="260" y="130" width="920" height="640" rx="6" fill="#050A1A" fill-opacity=".97"/>
  <rect x="260.5" y="130.5" width="919" height="639" rx="6" stroke="#00E8FF" stroke-opacity=".9"/>

  <g font-family="Consolas, monospace">
    <!-- ── 标题行 ────────────────────────────────────────────── -->
    <text x="284" y="163" font-size="15" letter-spacing="2" fill="#00E8FF">SETTINGS</text>
    <path d="M284 174H1156" stroke="url(#rail)" stroke-width="2"/>
    <!-- c.button("X", 28x22 @ px+panelW-paddingX-28, py+16) -->
    <rect x="1128" y="146" width="28" height="22" rx="3" fill="#00E8FF" fill-opacity=".04"/>
    <rect x="1128.5" y="146.5" width="27" height="21" rx="3" stroke="#00E8FF" stroke-opacity=".68"/>
    <text x="1142" y="160" text-anchor="middle" font-size="12" fill="#00E8FF">X</text>
    <text x="284" y="194" font-size="11" fill="#5A7A94">Live tweaks. Persisted to fluxplayer.ini on change.</text>
    <path d="M284 206H1156" stroke="#5A8CBE" stroke-opacity=".22"/>

    <!-- ── 左侧固定导航（bodyTop=230，按钮 34 高、间隔 6）── -->
    <g font-size="11">
      <rect x="284" y="230" width="136" height="34" rx="3" stroke="#5A8CBE" stroke-opacity=".22"/>
      <text x="352" y="251" text-anchor="middle" fill="#D0E8F8">GENERAL</text>
      <rect x="284" y="270" width="136" height="34" rx="3" stroke="#5A8CBE" stroke-opacity=".22"/>
      <text x="352" y="291" text-anchor="middle" fill="#D0E8F8">PLAYBACK</text>
      <rect x="284" y="310" width="136" height="34" rx="3" stroke="#5A8CBE" stroke-opacity=".22"/>
      <text x="352" y="331" text-anchor="middle" fill="#D0E8F8">SUBTITLE</text>
      <rect x="284" y="350" width="136" height="34" rx="3" stroke="#5A8CBE" stroke-opacity=".22"/>
      <text x="352" y="371" text-anchor="middle" fill="#D0E8F8">PROXY</text>
      <rect x="284" y="390" width="136" height="34" rx="3" stroke="#5A8CBE" stroke-opacity=".22"/>
      <text x="352" y="411" text-anchor="middle" fill="#D0E8F8">CAPTURE</text>
      <rect x="284" y="430" width="136" height="34" rx="3" stroke="#5A8CBE" stroke-opacity=".22"/>
      <text x="352" y="451" text-anchor="middle" fill="#D0E8F8">PANELS</text>
      <!-- 当前页：fill accentPrimary @0.16 + 描边 accentPrimary @1 -->
      <rect x="284" y="470" width="136" height="34" rx="3" fill="#00E8FF" fill-opacity=".16"/>
      <rect x="284.5" y="470.5" width="135" height="33" rx="3" stroke="#00E8FF"/>
      <text x="352" y="491" text-anchor="middle" fill="#00E8FF">LOGGING</text>
      <rect x="284" y="510" width="136" height="34" rx="3" stroke="#5A8CBE" stroke-opacity=".22"/>
      <text x="352" y="531" text-anchor="middle" fill="#D0E8F8">APPEARANCE</text>


    </g>

    <!-- ── 右侧内容区（contentX=436，contentW=706）───────────── -->
    <!-- 页头：页名 15px、说明 11px、下方细线（bodyTop+60 = 290） -->
    <text x="436" y="252" font-size="15" fill="#00E8FF">LOGGING</text>
    <text x="436" y="274" font-size="11" fill="#5A7A94">Diagnostics controls remain available while media keeps playing.</text>
    <path d="M436 290H1142" stroke="#5A8CBE" stroke-opacity=".22"/>

    <!--
      列表区 listY=290  listH=400（到 690）。
      section 占位 30 + 每行 54/34 交替；LOGGING 只有一个 section「LOGGING」，
      故列表首行即 section 标题（y=290+sectionGap6，标题基线 +11，细线 +17）。
    -->
    <text x="436" y="307" font-size="11" fill="#00E8FF">LOGGING</text>
    <path d="M436 313H1142" stroke="#5A8CBE" stroke-opacity=".22"/>

    <!-- 行 1：Log Level（option，54 高）→ combo，宽 = contentW*0.40 = 282.4 -->
    <text x="436" y="342" font-size="12" fill="#EAF8FF">Log Level</text>
    <rect x="633.7" y="328" width="282" height="28" rx="2" fill="#030817" stroke="#5A7A94" stroke-opacity=".55"/>
    <text x="643.7" y="347" font-size="11" fill="#EAF8FF">INFO</text>
    <path d="M900 338L906 344L912 338" stroke="#00E8FF" stroke-width="1.5"/>

    <!-- 行 2：Write log to file（bool，34 高）→ 复选框在左、文字紧跟其后 -->
    <rect x="436" y="389" width="12" height="12" rx="2" stroke="#00E8FF" fill="none"/>
    <path d="M439 395L442 398L447 391" stroke="#00E8FF" stroke-width="1.5" fill="none"/>
    <text x="456" y="400" font-size="12" fill="#EAF8FF">Write log to file</text>

    <!--
      行 3：Log File Path（text，hint 存在 → 54+20=74 高）
      pathKind = file → 输入框收窄 76+8，右侧跟 Browse 按钮。
      ratio 0.62 → wantW = 706*0.62 = 437.7；hasBrowse 后 ctrlW = 437.7-84 = 353.7
      Browse 起点 = 633.7+353.7+8 = 995.4
    -->
    <text x="436" y="446" font-size="12" fill="#EAF8FF">Log File Path</text>
    <rect x="633.7" y="432" width="353.7" height="28" rx="2" fill="#030817" stroke="#5A7A94" stroke-opacity=".55"/>
    <text x="643.7" y="451" font-size="11" fill="#5A7A94">~/Library/Caches/FluxPlayer/fluxplayer.log</text>
    <rect x="995.4" y="432" width="76" height="28" rx="3" fill="#EAF8FF" fill-opacity=".06"/>
    <rect x="995.9" y="432.5" width="75" height="27" rx="3" stroke="#EAF8FF" stroke-opacity=".68"/>
    <text x="1033" y="451" text-anchor="middle" font-size="11" fill="#EAF8FF">Browse</text>
    <!-- hint：与输入框同一起始 x，位于行内 +38 -->
    <text x="436" y="462" font-size="10" fill="#5A7A94">Empty = default app data dir.</text>

    <!--
      行 4：TCP Log Port（int，hint 存在 → 54+20=74 高）
      ratio 0.62 → ctrlW = 437.7（与 Log File Path 等宽，这是本次对齐项）。
      数字框为纯文本框（无 -/+ 按钮），失焦或回车才提交。
    -->
    <text x="436" y="528" font-size="12" fill="#EAF8FF">TCP Log Port</text>
    <rect x="633.7" y="514" width="437.7" height="28" rx="2" fill="#030817" stroke="#5A7A94" stroke-opacity=".55"/>
    <text x="643.7" y="533" font-size="11" fill="#EAF8FF">9999</text>
    <text x="436" y="544" font-size="10" fill="#5A7A94">Requires restart.</text>

    <!--
      滚动条：内容高超过 listH 时出现，位于内容区右侧预留带内（trackX = px+panelW-paddingX-scrollBarW+4）
      本页 contentH ≈ 30+54+34+74+74+4*8 = 298 < listH 400，故实际不出现；
      这里按「不出现」绘制，保持与运行时一致。
    -->

    <!-- ── 底部状态栏（footY = py+panelH-paddingY-32 = 720）────── -->
    <!-- 三态之一：WATCHING（热加载开启且无错误） -->
    <rect x="284" y="720" width="872" height="32" rx="3" fill="#00E8FF" fill-opacity=".10"/>
    <rect x="284.5" y="720.5" width="871" height="31" rx="3" stroke="#00E8FF" stroke-opacity=".55"/>
    <circle cx="296" cy="736" r="4" fill="#00E8FF"/>
    <text x="308" y="740" font-size="11" fill="#00E8FF">WATCHING / cyberpunk-neon / GEN 4</text>
  </g>
</svg>
